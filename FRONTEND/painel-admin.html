<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - CMEWEB</title>
    <link rel="stylesheet" href="estilos/painel-admin.css">
</head>
<body>
    <!-- Fica escondido até o login ser confirmado pela API (evita "piscar" para quem não está logado) -->
    <div id="pa-app" hidden>
        <header class="pa-topo">
            <h1>Painel CMEWEB</h1>
            <div class="pa-user">
                <span id="pa-usuario"></span>
                <button id="pa-sair" class="pa-btn pa-btn-sec" type="button">Sair</button>
            </div>
        </header>

        <nav class="pa-abas" id="pa-abas">
            <button type="button" data-aba="eventos" class="ativa">Eventos</button>
            <button type="button" data-aba="biblioteca">Biblioteca</button>
            <button type="button" data-aba="equipe">Equipe</button>
            <button type="button" data-aba="departamentos">Departamentos</button>
            <button type="button" data-aba="usuarios" id="pa-aba-usuarios" hidden>Usuários</button>
        </nav>

        <main class="pa-main">
            <div id="pa-msg" class="pa-msg" role="status" hidden></div>
            <div class="pa-barra">
                <h2 id="pa-titulo"></h2>
                <button id="pa-novo" class="pa-btn" type="button">+ Novo</button>
            </div>
            <div id="pa-tabela" class="pa-tabela-wrap"></div>
        </main>
    </div>

    <!-- Formulário de criar/editar -->
    <dialog id="pa-modal">
        <form id="pa-form" novalidate>
            <h3 id="pa-modal-titulo"></h3>
            <div id="pa-campos"></div>
            <p id="pa-erro" class="pa-erro" role="alert" hidden></p>
            <div class="pa-acoes-form">
                <button type="button" id="pa-cancelar" class="pa-btn pa-btn-sec">Cancelar</button>
                <button type="submit" id="pa-salvar" class="pa-btn">Salvar</button>
            </div>
        </form>
    </dialog>

    <!-- Membros de um departamento -->
    <dialog id="pa-membros">
        <h3 id="pa-membros-titulo"></h3>
        <div id="pa-membros-lista"></div>
        <form id="pa-membro-form" class="pa-membro-form" novalidate>
            <select id="pa-membro-equipe"></select>
            <input type="text" id="pa-membro-nome" placeholder="Nome (se não for da equipe)" maxlength="200">
            <input type="text" id="pa-membro-funcao" placeholder="Função" maxlength="200">
            <button type="submit" class="pa-btn">Adicionar</button>
        </form>
        <p id="pa-membros-erro" class="pa-erro" role="alert" hidden></p>
        <div class="pa-acoes-form">
            <button type="button" id="pa-membros-fechar" class="pa-btn pa-btn-sec">Fechar</button>
        </div>
    </dialog>

    <script src="scripts/api.js"></script>
    <script src="scripts/guarda-painel.js"></script>
    <script src="scripts/painel-admin.js"></script>
</body>
</html>
