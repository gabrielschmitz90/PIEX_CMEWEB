
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CMEWEB</title>

    <link rel="stylesheet" href="../estilos/estilos-globais.css">
    <link rel="stylesheet" href="../estilos/componentes.css">
    <link rel="stylesheet" href="../estilos/login.css">
</head>

<body class="login-page-body">

    <main class="login-main-container">
        <div class="login-card scale-in">

            <div class="login-header-section">
                <h2>Login CMEWEB</h2>
                <p>Acesse o painel administrativo</p>
            </div>

            <form id="loginForm">

                <div class="input-grupo">
                    <label for="usuario">Usuário</label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        maxlength="50"
                        required
                    >
                </div>

<div class="input-grupo">
    <label for="senha">Senha</label>

    <div class="senha-container">
        <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            maxlength="128"
            required
        >

        <button
            type="button"
            id="btnMostrarSenha"
            class="btn-mostrar-senha"
            aria-label="Mostrar senha"
            title="Mostrar senha"
        >
            <svg id="iconeOlho" viewBox="0 0 24 24"
                 width="21" height="21"
                 fill="none" stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </button>
    </div>
</div>

                <p
                    id="loginMensagem"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></p>

                <button
                    id="btnEntrar"
                    type="submit"
                    class="btn-primario"
                >
                    Entrar
                </button>

            </form>
        </div>
    </main>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/login.js"></script>

</body>
</html>
